<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgTop" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#0F1735"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16C7FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16C7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgTop)"/>

  <!-- Subtle gradient border -->
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="160" cy="160" rx="120" ry="80" fill="#16C7FF" fill-opacity="0.04"/>
  <ellipse cx="352" cy="352" rx="100" ry="80" fill="#8B5CF6" fill-opacity="0.05"/>

  <!-- N lettermark soft glow layer -->
  <g filter="url(#softGlow)" opacity="0.4">
    <path d="M 128 384 L 128 128 L 384 384 L 384 128"
      stroke="url(#nGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- N lettermark main -->
  <g filter="url(#glow)">
    <path d="M 128 384 L 128 128 L 384 384 L 384 128"
      stroke="url(#nGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
