    <!--
      Script inline: aplica o tema em documentElement ANTES do React montar.
      ThemeContext faz o mesmo: document.documentElement.classList.add('light').
      Sem isso, há flash branco (dark) ou flash escuro (light) no carregamento.
    -->
    <script>
      try {
        var t = localStorage.getItem('novux_theme');
        // Dark é o padrão — só aplica classe quando é light
        if (t === 'light') document.documentElement.classList.add('light');
      } catch(e) {}
    </script>
    <style>
      /* Cor de fundo inicial via CSS vars do tema — sem flash de cor errada */
      html { background-color: #050816; }
      html.light { background-color: #f5f7fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
