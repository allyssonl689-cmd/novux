  <style>
    /* Fundo escuro por padrão enquanto React carrega (evita flash branco) */
    /* ThemeContext substitui isso assim que monta */
    body { background-color: #050816; }
    /* Se o usuário tinha o tema claro salvo, evita flash escuro */
    body.light { background-color: #f5f7fa; }
  </style>
  <script>
    /* Aplica o tema salvo ANTES do React montar — elimina flashes */
    try {
      var t = localStorage.getItem('novux_theme');
      if (t === 'light') document.body.classList.add('light');
    } catch(e) {}
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
